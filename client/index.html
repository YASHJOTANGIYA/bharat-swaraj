<!doctype html>
<html lang="gu">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Bharat Swaraj - India's trusted news source. Get the latest breaking news, politics, sports, entertainment, and business updates in Gujarati and English." />
  <meta name="keywords"
    content="Bharat Swaraj, News, India News, Gujarati News, Latest News, Breaking News, Politics, Sports, Entertainment, Business" />
  <meta name="author" content="Bharat Swaraj Team" />

  <!-- Performance Optimization: Preconnect & DNS-Prefetch -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://res.cloudinary.com" />
  <link rel="dns-prefetch" href="https://www.youtube.com" />
  <link rel="dns-prefetch" href="https://i.ytimg.com" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://bharat-swaraj.vercel.app/" />
  <meta property="og:title" content="Bharat Swaraj - Latest News & Updates" />
  <meta property="og:description"
    content="Bharat Swaraj - India's trusted news source. Get the latest breaking news, politics, sports, entertainment, and business updates in Gujarati and English." />
  <meta property="og:image" content="https://bharat-swaraj.vercel.app/logo.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://bharat-swaraj.vercel.app/" />
  <meta property="twitter:title" content="Bharat Swaraj - Latest News & Updates" />
  <meta property="twitter:description"
    content="Bharat Swaraj - India's trusted news source. Get the latest breaking news, politics, sports, entertainment, and business updates in Gujarati and English." />
  <meta property="twitter:image" content="https://bharat-swaraj.vercel.app/logo.png" />

  <title>Bharat Swaraj - Latest News & Updates</title>

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6741193300888829"
     crossorigin="anonymous"></script>

  <!-- Structured Data for SEO (helps with Google Sitelinks & Knowledge Panel) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://bharatswarajweekly.com/#website",
          "url": "https://bharatswarajweekly.com/",
          "name": "Bharat Swaraj",
          "description": "India's trusted news source. Get the latest breaking news, politics, sports, entertainment, and business updates in Gujarati and English.",
          "inLanguage": ["gu", "en"],
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://bharatswarajweekly.com/search?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://bharatswarajweekly.com/#organization",
          "name": "Bharat Swaraj Weekly",
          "url": "https://bharatswarajweekly.com/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://bharatswarajweekly.com/logo.png"
          },
          "sameAs": [
            "https://www.facebook.com/profile.php?id=...", 
            "https://www.youtube.com/@BharatSwarajWeekly"
          ]
        }
      ]
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
