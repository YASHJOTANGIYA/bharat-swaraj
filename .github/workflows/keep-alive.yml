name: Render Keep-Alive

on:
  schedule:
    # Runs every 12 minutes (Render spins down after 15 minutes)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -s -f -m 30 https://bharat-swaraj.onrender.com/api/ping || echo "Backend ping attempted"
